    <main>
      <section>
        <h2>Video Tutorial 1</h2>

        <video
          src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
          controls
          autoplay
          loop
          muted
          width="700px"
          height="400px"
        >
          <p>
            Your browser doesn't support HTML video. Here is a
            <a
              href="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
              >link to the video file</a
            >
            instead.
          </p>
        </video>
      </section>

      <section>
        <h2>Video Tutorial 2</h2>
        <iframe
          width="700px"
          height="400px"
          src="https://www.youtube.com/embed/e4lYE5yoVPU?si=848zyGVxJWeL5Gsg"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        >
          <p>
            Your browser doesn't support HTML video. Here is a
            <a
              href="https://www.youtube.com/embed/e4lYE5yoVPU?si=848zyGVxJWeL5Gsg"
              >link to the video file</a
            >
            instead.
          </p>
        </iframe>
      </section>
