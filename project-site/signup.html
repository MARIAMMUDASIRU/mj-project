<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | Clayette Studio</title>
  </head>
  <body>
    <header>
      <hgroup>
        <h1>Clayette Studio</h1>
      </hgroup>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="signup.html">Join the community</a></li>
          <li><a href="video-player.html">Video Tutorial</a></li>
          <li><a href="audio-player.html">Audio Guide</a></li>
          <li><a href="art-archives.html">Archives</a></li>
        </ul>
      </nav>
      <hgroup>
        <h1>You Are Welcome To Join The Clayette community</h1>
      </hgroup>
    </header>

    <main>
      <form action="submit.html" method="POST">
        <fieldset>
          <legend>Sign Up</legend>
          <div>
            <label for="name">Username</label>
            <input type="text" name="name" id="name" required />
          </div>
          <div>
            <label for="picture">Profile Picture</label>
            <input type="file" name="picture" id="picture" />
          </div>
          <div>
            <label for="address">Address Information</label>
            <input
              type="text"
              name="address"
              id="address"
              placeholder="Street Name"
              disabled
            />
          </div>
          <div>
            <label for="age">Age</label>
            <input type="number" name="age" id="age" />
          </div>
          <div>
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="email@example.com"
              pattern="[a-zA-Z0-9]+@[a-zA-Z]+\.[a-zA-Z]+"
              required
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="8 characters minimum"
              minlength="8"
              required
            />
          </div>
          <div>
            <label for="password">Confirm Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="8 characters minimum"
              minlength="8"
              required
            />
          </div>
          <div>
            <label for="newsletter">Yes! Send me tips.</label>
            <input
              type="checkbox"
              id="newsletter"
              name="newsletter"
              value="subscribe"
              checked
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Choose your frequency</legend>
          <div>
            <label for="weekly">Weekly</label>
            <input type="radio" id="weekly" name="frequency" value="weekly" />
          </div>
          <div>
            <label for="monthly">Monthly</label>
            <input type="radio" id="monthly" name="frequency" value="monthly" />
          </div>
        </fieldset>
        <button type="submit">Create account</button>
      </form>
    </main>
    <footer>
      <p><small>2025 By Mariam Mudasiru | Crafted With Love </small></p>
    </footer>
  </body>
</html>
